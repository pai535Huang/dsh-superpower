name: Auto-merge small PRs

# 小改动（≤ 100 行 diff）自动合并并删除分支；大改动留给人工。
# 阈值修改：把下面 SMALL_PR_LINES 改掉即可。

on:
  pull_request:
    types: [opened, reopened, synchronize]
  schedule:
    # 每小时清扫一次已合并 PR 的残留分支（closed 事件对 auto-merge 合并不派发，不能依赖）
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  SMALL_PR_LINES: 100

jobs:
  maybe-auto-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Measure diff size (base...head)
        id: size
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git fetch --depth=1 origin "$BASE" "$HEAD"
          TOTAL=$(git diff --numstat "$BASE" "$HEAD" | awk '{a+=$1; d+=$2} END {print a+d}')
          TOTAL=${TOTAL:-0}
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "diff size: $TOTAL lines (base=$BASE head=$HEAD)"
          if [ "$TOTAL" -le "$SMALL_PR_LINES" ]; then
            echo "is-small=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-small=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge for small PRs
        if: steps.size.outputs.is-small == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "🤖 小改动（≤ $SMALL_PR_LINES 行），已开启自动合并：CI 通过后自动合并，残留分支由定时清扫（≤1 小时）删除。"
          gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --auto --merge
        continue-on-error: true

      - name: Remind on larger PRs
        if: steps.size.outputs.is-small == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "📏 改动超过 $SMALL_PR_LINES 行（实际 ${{ steps.size.outputs.total }}），需要人工审阅后合并。"
        continue-on-error: true

  prune-merged-branches:
    # 定时清扫：删除所有已合并 PR 的残留远端分支（≤1 小时延迟，自愈）；workflow_dispatch 可手动触发
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches of merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "${{ github.repository }}" --state merged --limit 100 --json headRefName \
            | python3 -c "import json,sys; [print(p['headRefName']) for p in json.load(sys.stdin)]" \
            | while read -r BR; do
                gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BR" >/dev/null 2>&1 \
                  && echo "deleted $BR" || echo "skip $BR (gone or protected)"
              done
